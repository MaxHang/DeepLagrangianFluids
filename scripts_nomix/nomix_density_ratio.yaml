# ====================================================================
# 配置文件: 密度比权重模式 (Density Ratio Weighting Mode)
# ====================================================================
# 
# 该配置使用简单的密度比权重进行密度条件化:
#   w = (1 - r²)³ × (ρⱼ/ρᵢ)
#
# 优点:
#   - 计算高效，无额外学习参数
#   - 物理直觉清晰，密度高的邻居影响大
#   - 训练稳定，收敛快
#
# 适用场景:
#   - 基线实验
#   - 资源受限的训练环境
#   - 需要快速验证的场景
# ====================================================================

# 数据集路径
dataset_dir: "/workspace/xyh_synology/graduate/datasets/nomix-fluid-cconv"

# 模型配置
model:
  # 基础参数
  particle_radius: 0.05
  rest_dens: 1000
  
  # 网络结构
  use_sym: false  # 不使用对称卷积
  
  # 多密度流体支持
  multi_density_support: true
  density_condition_layers: true  # 启用密度条件化
  density_relative: true          # 使用相对密度
  use_density: true               # 使用密度特征
  
  # 密度嵌入
  density_embed: true
  density_embed_dim: 8
  
  # 🔥 密度条件化模式: 密度比权重
  density_modulation_mode: 'density_ratio'  # 使用简单的密度比权重

# 训练数据配置
train_data:
  random_rotation: true  # 随机旋转训练数据（围绕重力轴）

# 训练输出目录
train_dir: "/workspace/xyh_synology/graduate/weights/nomix-fluid/density_ratio"
